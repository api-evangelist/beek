name: Beek
description: 'Beek was a Spanish-language audiobook and ebook streaming platform serving
  Latin America and Spain, backed by Accel and Lightspeed Venture Partners. At its
  peak it reached over 4 million users who streamed nearly 200 million minutes of audio
  content, including its exclusive Beek Originals catalog. The service has since shut
  down: Amazon''s Audible acquired a significant portion of the Beek Originals catalog,
  and Beek now redirects listeners to Audible to continue their libraries. Beek ran
  a private backend service (api.beek.io) but published no public developer program,
  OpenAPI specification, SDKs, or developer documentation, so it has no consumable
  API surface to enrich.'
